<!doctype html>
<html lang="en" data-theme="pasteldusk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>Routine Planner</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      // Default is Pastel Dusk (dark); an explicit "pastel" choice wins.
      try {
        var t = localStorage.getItem("rp-theme");
        document.documentElement.setAttribute("data-theme", t === "pastel" ? "pastel" : "pasteldusk");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
