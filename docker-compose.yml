services:
  planner:
    build: .
    ports:
      - "8080:3000"
    environment:
      - PORT=3000
      - DATA_DIR=/data
    volumes:
      - planner-data:/data        # ← the persistent volume (app.db)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  planner-data: